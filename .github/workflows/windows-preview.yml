name: Windows preview release

on:
  push:
    tags: ['yushi-windows-v*']

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude qingjian-macos --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude qingjian-macos --locked
      - run: python3 tools/eval/test_journal.py
      - run: python3 tools/eval/test_input_quality.py
      - run: python3 tools/eval/test_daily_reading.py
      - run: python3 tools/eval/test_lexicon.py
      - run: python3 tools/lexicon/test_supplement.py
      - run: python3 tools/release/test_windows_preview.py

  windows-build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      QINGJIAN_UIACCESS: '0'
      PYTHON: python
      PYTHONUTF8: '1'
      PREVIEW_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, versions and main ancestry
        run: python tools/release/windows-preview.py validate
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.96.0
          components: clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Full Windows workspace regression and lint
        run: |
          cargo clippy --workspace --exclude qingjian-macos --all-targets --locked -- -D warnings
          cargo test --workspace --exclude qingjian-macos --locked
          cargo test -p qingjian-platform --test native_diagnostics --locked -- --ignored
          python tools/eval/test_journal.py
          python tools/eval/test_input_quality.py
          python tools/eval/test_daily_reading.py
          python tools/eval/test_lexicon.py
          python tools/lexicon/test_supplement.py
          python tools/release/test_windows_preview.py
      - name: Fetch and verify locked product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/release/data-fetch.sh
      - name: Verify shipped model becomes idle after typing
        run: cargo test --release -p qingjian-windows-server --test model_idle --locked -- --ignored --nocapture
      - name: Build evaluation CLI
        run: cargo build --release -p qingjian-cli --locked
      - name: Evaluate fixed journal corpus with shipped model
        run: python tools/eval/journal.py --binary target/release/qingjian-cli.exe --output target/journal-ci --model data/models/hanzhang-tongbian/hanzhang-tongbian-small.qjm
      - name: Evaluate 1444 pinyin combinations without model or network
        run: python tools/eval/input_quality.py --binary target/release/qingjian-cli.exe --output target/input-quality-ci
      - name: Evaluate independent daily reading and imported lexicon
        run: |
          python tools/eval/daily_reading.py --binary target/release/qingjian-cli.exe --output target/daily-static-ci
          python tools/eval/daily_reading.py --binary target/release/qingjian-cli.exe --output target/daily-model-ci --model data/models/hanzhang-tongbian/hanzhang-tongbian-small.qjm
          python tools/eval/lexicon.py --binary target/release/qingjian-cli.exe --output target/lexicon-ci
      - name: Install verified Inno Setup 7.1.0
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $exe
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup SHA256 mismatch' }
          $result = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Inno Setup installation failed: $($result.ExitCode)" }
      - name: Build x64 installer with x86 TSF DLL
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps/windows/installer/build.ps1
      - name: Stage installer, checksums and evaluation evidence
        run: python tools/release/windows-preview.py stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-preview
          path: target/windows-preview/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: [portable-tests, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-preview
          path: target/windows-preview
      - name: Verify staged artifacts and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: ${{ github.ref_name }}
        run: |
          cd target/windows-preview
          sha256sum --check SHA256SUMS
          cd ../..
          gh release create "$PREVIEW_TAG" target/windows-preview/* --verify-tag --prerelease --title "Windows 测试版 ${PREVIEW_TAG#yushi-windows-v}" --notes-file docs/notes/windows-preview-release.md
